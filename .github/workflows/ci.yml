name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both: the module export list is where GCC and clang disagree most,
        # and clang is the stricter one about what may be exported.
        toolchain: [default, llvm]
    name: build (${{ matrix.toolchain }})
    steps:
      - uses: actions/checkout@v4

      # XLINGS_NON_INTERACTIVE is required: without it the installer takes its
      # `curl | bash` branch and runs `xlings self install < /dev/tty`, and a
      # runner's /dev/tty is readable but not connected.
      #
      # XLINGS_VERSION PINS THE INSTALLER. Unpinned, this step took whatever
      # was newest that morning, so a red run could not be told apart from an
      # ecosystem change — the one thing a fork's CI exists to rule out. The
      # installer reads `${1:-${XLINGS_VERSION:-}}`, so the environment form
      # pins it without changing the `curl | bash` shape.
      #
      # mcpp itself stays UNPINNED on purpose: this package depends on the
      # ECOSYSTEM (`xim:mesa` declaring __EGL_VENDOR_LIBRARY_DIRS), and a
      # pinned mcpp tarball carries a frozen snapshot of it. Pin the tool that
      # installs, float the ecosystem under test.
      - name: Install xlings + mcpp
        env:
          XLINGS_NON_INTERACTIVE: "1"
          XLINGS_VERSION: "2026.8.27.5"
        run: |
          curl -fsSL https://d2learn.org/xlings-install.sh | bash
          echo "$HOME/.xlings/bin" >> "$GITHUB_PATH"
          "$HOME/.xlings/bin/xlings" install mcpp
          echo "$HOME/.xlings/subos/default/bin" >> "$GITHUB_PATH"

      - name: Select toolchain
        if: matrix.toolchain != 'default'
        run: |
          mcpp toolchain install ${{ matrix.toolchain }}
          mcpp toolchain default ${{ matrix.toolchain }}

      - name: Build the workspace
        run: |
          mcpp --version
          mcpp build --workspace

      - name: every member's test
        run: |
          for m in egl glesv2 glesv1 opengl; do
            echo "── mcpp/$m ──"
            mcpp test -p "mcpp/$m"
          done

      # Artifacts are located by searching the tree: where a workspace build
      # puts its output is mcpp's business and has moved between versions.
      #
      # A SONAME check alone would pass on an EMPTY library — mcpp can link a
      # .so out of zero objects and report success — so each library is also
      # asked for symbols only its own sources define.
      - name: both libraries carry the canonical SONAMEs, and real contents
        run: |
          check() {
            file=$1; want=$2; shift 2
            so=$(find . -name "$file" -type f | head -1)
            if [ -z "$so" ]; then echo "::error::$file was not built"; find . -name '*.so*' -type f; exit 1; fi
            got=$(readelf -d "$so" | sed -n 's/.*SONAME.*\[\(.*\)\]/\1/p')
            echo "$file -> SONAME $got, $(stat -c%s "$so") bytes"
            if [ "$got" != "$want" ]; then echo "::error::expected SONAME $want"; exit 1; fi
            for sym in "$@"; do
              if ! readelf --dyn-syms -W "$so" | grep -qE " (FUNC|OBJECT) .* $sym$"; then
                echo "::error::$file does not define $sym — it linked, but out of what?"
                readelf --dyn-syms -W "$so" | head -30; exit 1
              fi
            done
            echo "   defines: $*"
          }
          check libGLdispatch.so libGLdispatch.so.0 \
            __glDispatchInit __glDispatchMakeCurrent __glDispatchNewVendorID
          check libEGL.so libEGL.so.1 \
            eglInitialize eglQueryString eglGetProcAddress eglGetPlatformDisplay
          # The GL family. Each symbol named here is one that only that API's
          # dispatch table can supply, so a table swapped between members would
          # fail rather than build a plausible-looking wrong library.
          check libGLESv2.so libGLESv2.so.2 \
            glClear glCreateShader glDrawArrays glTexImage2D
          check libGLESv1_CM.so libGLESv1_CM.so.1 \
            glClear glMatrixMode glOrthof glEnableClientState
          check libOpenGL.so libOpenGL.so.0 \
            glClear glGenVertexArrays glDrawElements glUseProgram

      # The GL libraries must not carry each other's APIs. GLESv1_CM is the
      # fixed-function profile and GLESv2 is the shader one; if a member picked
      # up the wrong MAPI_ABI_HEADER both would still link, both would export
      # ~the right number of symbols, and only this tells them apart.
      - name: the GL profiles do not overlap
        run: |
          has() { readelf --dyn-syms -W "$1" | grep -qE " FUNC .* $2\$"; }
          v1=$(find . -name libGLESv1_CM.so -type f | head -1)
          v2=$(find . -name libGLESv2.so -type f | head -1)
          if has "$v1" glCreateShader; then
            echo "::error::libGLESv1_CM exports the SHADER api — wrong dispatch table"; exit 1
          fi
          if has "$v2" glMatrixMode; then
            echo "::error::libGLESv2 exports the FIXED-FUNCTION api — wrong dispatch table"; exit 1
          fi
          echo "GLESv1_CM and GLESv2 carry disjoint profiles"

      # The module export lists are generated from the headers INTERSECTED with
      # the built libraries, so they can drift the moment either moves.
      - name: the GL module wrappers match the generator
        run: |
          set -- "glesv2:GLES3/gl32.h:libGLESv2.so" \
                 "glesv1:GLES/gl.h:libGLESv1_CM.so" \
                 "opengl:GL/glcorearb.h:libOpenGL.so"
          for spec in "$@"; do
            g=${spec%%:*}; rest=${spec#*:}; h=${rest%%:*}; l=${rest#*:}
            so=$(find . -name "$l" -type f | head -1)
            mcpp/tools/genglmod.sh "$g" "$h" "$so" "mcpp/$g/src/$g.cppm"
          done
          if ! git diff --quiet; then
            echo "::error::GL module wrappers are out of date — run mcpp/tools/genglmod.sh"
            git diff --stat
            exit 1
          fi
          echo "GL module wrappers match the headers and the built libraries"

      # The same question from the other side: how many TUs did each member
      # actually compile? A dropped `sources` entry leaves the link green and
      # the library short, and the symbol check above only covers what it names.
      - name: every declared source became an object
        run: |
          for m in gldispatch egl glesv2 glesv1 opengl; do
            n=$(find "mcpp/$m/target" -name '*.o' | wc -l)
            echo "mcpp/$m compiled $n object(s)"
            if [ "$n" -lt 10 ]; then
              echo "::error::mcpp/$m compiled only $n objects; the manifest declares far more"
              find "mcpp/$m/target" -name '*.o'; exit 1
            fi
          done

      - name: libEGL links GLdispatch, and reaches no host library
        run: |
          # Written with `if`, not `grep -q … && { exit 1; }`: under `bash -e`
          # that compound returns non-zero when grep finds nothing, which is the
          # passing case.
          so=$(find . -name libEGL.so -type f | head -1)
          if ! readelf -d "$so" | grep -q 'NEEDED.*libGLdispatch\.so\.0'; then
            echo "::error::libEGL does not link libGLdispatch"; readelf -d "$so" | grep NEEDED; exit 1
          fi
          if readelf -d "$so" | grep -qE 'NEEDED.*\b(libX11|libxcb|libwayland)'; then
            echo "::error::libEGL pulled a window system in; ENABLE_EGL_X11 must stay off"
            readelf -d "$so" | grep NEEDED; exit 1
          fi
          echo "libEGL -> libGLdispatch, and nothing windowing"

      - name: every module produced an interface
        run: |
          for m in khronos.egl khronos.glesv2 khronos.glesv1 khronos.opengl; do
            if ! find . \( -name "$m.gcm" -o -name "$m.pcm" \) | head -1 | grep -q .; then
              echo "::error::no module interface for $m"
              find . \( -name '*.gcm' -o -name '*.pcm' \) | sed 's|.*/||' | sort -u
              exit 1
            fi
            echo "$m ok"
          done

  generated:
    name: mcpp/generated/ matches upstream's generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: regenerate and diff
        run: |
          # The dispatch tables are checked in so that no generator runs during
          # a consumer's build. Checked in means they can drift; this is what
          # stops it. Python appears HERE and nowhere else.
          cd upstream/src/generate
          python3 gen_gldispatch_mapi.py gldispatch xml/gl.xml xml/gl_other.xml > /tmp/glapi_mapi_tmp.h
          python3 gen_egl_dispatch.py header xml/egl.xml > /tmp/g_egldispatchstubs.h
          python3 gen_egl_dispatch.py source xml/egl.xml > /tmp/g_egldispatchstubs.c
          # One table per API flavour, exactly as upstream's
          # src/generate/meson.build `foreach` does. g_glapi_mapi_gl_tmp.h is
          # NOT here on purpose: it is libGL's, libGL needs X11, and this fork
          # builds only the three window-system-free libraries.
          for g in opengl glesv1 glesv2; do
            python3 gen_gldispatch_mapi.py "$g" xml/gl.xml xml/gl_other.xml \
              > "/tmp/g_glapi_mapi_${g}_tmp.h"
          done
          cd "$GITHUB_WORKSPACE"
          for f in glapi_mapi_tmp.h g_egldispatchstubs.h g_egldispatchstubs.c \
                   g_glapi_mapi_opengl_tmp.h g_glapi_mapi_glesv1_tmp.h \
                   g_glapi_mapi_glesv2_tmp.h; do
            if ! diff -q "/tmp/$f" "mcpp/generated/$f" >/dev/null; then
              echo "::error file=mcpp/generated/$f::out of date — see mcpp/generated/README.md"
              diff "/tmp/$f" "mcpp/generated/$f" | head -20
              exit 1
            fi
          done
          echo "generated dispatch code matches the registries"

  upstream:
    name: upstream/ is the release tarball, unmodified
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: diff upstream/ against libglvnd v1.7.0
        run: |
          curl -L -fsS -o glvnd.tar.gz \
            "https://gitlab.freedesktop.org/glvnd/libglvnd/-/archive/v1.7.0/libglvnd-v1.7.0.tar.gz"
          echo "2b6e15b06aafb4c0b6e2348124808cbd9b291c647299eaaba2e3202f51ff2f3d  glvnd.tar.gz" | sha256sum -c -
          mkdir -p /tmp/pristine && tar -xzf glvnd.tar.gz -C /tmp/pristine
          if diff -r --exclude=__pycache__ /tmp/pristine/libglvnd-v1.7.0 upstream; then
            echo "upstream/ is pristine"
          else
            echo "::error::upstream/ differs from the release tarball. Everything this fork adds belongs under mcpp/."
            exit 1
          fi
